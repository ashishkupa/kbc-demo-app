name: Build and scan
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t kbc-payments:${{ github.sha }} .

      - name: Upwind image scan
        uses: upwindsecurity/shiftleft-create-image-scan-event-action@main
        with:
          docker_image: kbc-payments:${{ github.sha }}
          pull_image: false
          main_branch: ${{ github.base_ref }}
          pr_id: ${{ github.event.number }}
          add_comment: ${{ github.event_name == 'pull_request' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.number }}
          repo_name: ${{ github.repository }}
          enforce_block_policy: true
          upwind_uri: eu.upwind.io   # REMOVE if your tenant is US; use me/ap if applicable
          upwind_client_id: ${{ secrets.UPWIND_CLIENT_ID }}
          upwind_client_secret: ${{ secrets.UPWIND_CLIENT_SECRET }}
